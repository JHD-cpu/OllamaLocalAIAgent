<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OllamaChat</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --ink: #1d1a16;
      --muted: #6b6358;
      --accent: #0f6b5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, #fff8e8 0%, transparent 42%),
        radial-gradient(circle at 80% 10%, #d9efe9 0%, transparent 36%),
        linear-gradient(160deg, #efe7d8, #f7f3ec 48%, #e7f2ef);
    }
    .card {
      width: min(420px, 90vw);
      text-align: center;
      padding: 2.5rem 1.5rem;
    }
    .brand-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.25rem;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(88, 40, 160, 0.35));
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      min-height: 3em;
    }
    .dot {
      width: 12px;
      height: 12px;
      margin: 1.5rem auto 0;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.45; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="brand-icon" src="icon.png" alt="OllamaChat" width="96" height="96" />
    <h1>OllamaChat</h1>
    <p id="status">正在启动本地服务…</p>
    <div class="dot" aria-hidden="true"></div>
  </div>
  <script>
    window.__setStatus = function (text) {
      var el = document.getElementById('status')
      if (el) el.textContent = text
    }
  </script>
</body>
</html>
