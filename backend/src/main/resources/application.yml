server:
  address: 127.0.0.1
  port: 8080

logging:
  file:
    name: logs/app.log
  level:
    root: INFO
    com.aitest.chat: INFO
    org.springframework.web: INFO

spring:
  application:
    name: ollama-chat
  datasource:
    url: jdbc:sqlite:data/rag.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON

app:
  settings-file: data/settings.json
  software-file: data/installed-software.json
  deps-dir: deps
  rag:
    text-dir: data/knowledge
    paddle-python: python
    paddle-script: scripts/paddle_ocr.py
    vector-store-file: data/vectors.json
    embedding-dimensions: 1024
    chunk-max-chars: 4000
    breakpoint-percentile: 95
    ocr-min-chars: 20
  ollama:
    llm-provider: ollama
    api-key: ""
    base-url: http://127.0.0.1:11434
    model: qwen3.5:9b
    system-prompt: 你是一个简洁、可靠的中文助手。回答尽量直接，不确定时说明不确定。
    temperature: 0.7
    top-p: 0.9
    top-k: 40
    num-ctx: 32768
    num-predict: -1
    repeat-penalty: 1.1
    think: false
    web-enabled: false
    web-provider: bing
    web-search-url: http://127.0.0.1:8888
    web-max-results: 5
    web-fetch: true
    web-max-rounds: 3
    rag-enabled: false
    embedding-model: bge-m3
    rag-top-k: 4
    code-enabled: false
    code-workspace: data/workspace
    code-timeout-seconds: 20
    code-max-rounds: 6
